<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinker's Crossing — Cartoon Brawler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1426; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- Loading screen ---------- */
    #loading-screen {
      position: fixed; inset: 0; z-index: 50;
      background: linear-gradient(160deg, #2b1e3d 0%, #1a1426 60%, #10202e 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif; color: #ffe9b3;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-title { font-size: 42px; letter-spacing: 4px; text-shadow: 0 4px 0 #6b3f12, 0 8px 18px rgba(0,0,0,.6); margin-bottom: 6px; }
    #loading-sub { font-size: 15px; opacity: .75; margin-bottom: 34px; letter-spacing: 2px; }
    #loading-bar-wrap { width: 380px; height: 22px; border-radius: 12px; background: rgba(0,0,0,.45); border: 2px solid #7a5a2f; overflow: hidden; }
    #loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb63d, #ff7847); border-radius: 10px; transition: width .2s ease; }
    #loading-pct { margin-top: 10px; font-size: 14px; opacity: .8; min-height: 18px; }
    #start-btn {
      margin-top: 30px; padding: 14px 52px; font-size: 22px; font-family: inherit; letter-spacing: 3px;
      color: #3a230d; background: linear-gradient(180deg, #ffd76a, #ffab3d); border: 3px solid #8a5a1d;
      border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #8a5a1d, 0 12px 24px rgba(0,0,0,.5);
      transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease; display: none;
    }
    #start-btn:hover { transform: translateY(-2px); }
    #start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a5a1d; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; font-family: 'Trebuchet MS', sans-serif; display: none; }
    #hp-wrap { position: absolute; left: 22px; top: 18px; width: 300px; }
    #hp-label { color: #ffe9b3; font-size: 13px; letter-spacing: 2px; text-shadow: 0 2px 2px #000; margin-bottom: 4px; }
    #hp-bar-bg { height: 22px; border-radius: 11px; background: rgba(0,0,0,.5); border: 2px solid #7a5a2f; overflow: hidden; }
    #hp-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #58d063, #8ee06a); transition: width .15s ease; border-radius: 9px; }
    #weapon-wrap { position: absolute; left: 22px; top: 62px; display: flex; gap: 8px; }
    .weapon-slot { padding: 5px 14px; font-size: 13px; color: #cbb389; background: rgba(0,0,0,.45); border: 2px solid #4d3d22; border-radius: 9px; letter-spacing: 1px; }
    .weapon-slot.active { color: #ffe9b3; border-color: #ffb63d; background: rgba(80,50,10,.6); }
    #combo-wrap { position: absolute; right: 26px; top: 74px; text-align: right; opacity: 0; transition: opacity .2s; }
    #combo-count { font-size: 46px; color: #ffd76a; text-shadow: 0 3px 0 #8a4a12, 0 6px 16px rgba(0,0,0,.7); font-weight: bold; }
    #combo-label { font-size: 13px; color: #ffb63d; letter-spacing: 3px; }
    #enemy-count { position: absolute; right: 26px; top: 18px; color: #ffd0a0; font-size: 14px; text-shadow: 0 2px 2px #000; letter-spacing: 1px; }

    /* ---------- Boss bar ---------- */
    #boss-bar-wrap { position: absolute; left: 50%; transform: translateX(-50%); bottom: 34px; width: min(680px, 70vw); opacity: 0; transition: opacity .4s ease; }
    #boss-name { text-align: center; color: #ffd0b0; font-size: 15px; letter-spacing: 4px; text-shadow: 0 2px 3px #000; margin-bottom: 5px; }
    #boss-hp-bg { height: 18px; border-radius: 9px; background: rgba(0,0,0,.6); border: 2px solid #7a2f2f; overflow: hidden; }
    #boss-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #d84334, #ff7c5c); border-radius: 7px; transition: width .2s ease; }

    /* ---------- Wave banner ---------- */
    #wave-banner {
      position: absolute; left: 50%; top: 26%; transform: translateX(-50%);
      font-size: 40px; letter-spacing: 6px; color: #ffe9b3; text-shadow: 0 4px 0 #6b3f12, 0 10px 24px rgba(0,0,0,.7);
      opacity: 0; transition: opacity .4s ease; white-space: nowrap;
    }

    /* ---------- End screens ---------- */
    .end-screen {
      position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Trebuchet MS', sans-serif; background: rgba(10,6,18,.72); backdrop-filter: blur(3px);
    }
    .end-title { font-size: 74px; letter-spacing: 10px; text-shadow: 0 6px 0 #000, 0 12px 34px rgba(0,0,0,.8); margin-bottom: 18px; }
    #victory-screen .end-title { color: #ffd76a; }
    #gameover-screen .end-title { color: #ff6a5c; }
    .end-sub { color: #d9c9a8; font-size: 16px; letter-spacing: 2px; margin-bottom: 34px; }
    .restart-btn { pointer-events: auto; padding: 12px 44px; font-size: 20px; font-family: inherit; letter-spacing: 2px; color: #3a230d;
      background: linear-gradient(180deg, #ffd76a, #ffab3d); border: 3px solid #8a5a1d; border-radius: 12px; cursor: pointer;
      box-shadow: 0 5px 0 #8a5a1d; }
    .restart-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a1d; }

    /* ---------- Pause ---------- */
    #pause-screen { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
      background: rgba(10,6,18,.55); font-family: 'Trebuchet MS', sans-serif; }
    #pause-inner { text-align: center; color: #ffe9b3; }
    #pause-inner h2 { font-size: 44px; letter-spacing: 8px; text-shadow: 0 4px 0 #000; margin-bottom: 10px; }
    #pause-inner p { font-size: 15px; opacity: .8; letter-spacing: 2px; }

    /* ---------- Debug panel ---------- */
    #debug-panel {
      position: fixed; left: 10px; bottom: 10px; z-index: 60; display: none; min-width: 250px;
      background: rgba(8,10,16,.82); color: #9fe8a0; font: 11px/1.5 monospace; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #2c3b2f; max-height: 60vh; overflow-y: auto; pointer-events: auto;
    }
    #debug-panel h4 { color: #ffd76a; font-size: 11px; margin: 4px 0; letter-spacing: 1px; }
    #debug-panel label { display: block; cursor: pointer; user-select: none; }
    #debug-stats { white-space: pre; color: #cfe3ff; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="loading-screen">
    <div id="loading-title">TINKER'S CROSSING</div>
    <div id="loading-sub">A CARTOON MEDIEVAL BRAWLER</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-pct">Loading 0%</div>
    <button id="start-btn">START GAME</button>
  </div>

  <div id="hud">
    <div id="hp-wrap">
      <div id="hp-label">HP</div>
      <div id="hp-bar-bg"><div id="hp-bar"></div></div>
    </div>
    <div id="weapon-wrap">
      <div class="weapon-slot" id="slot-sword">1 SWORD</div>
      <div class="weapon-slot" id="slot-hammer">2 HAMMER</div>
    </div>
    <div id="combo-wrap"><div id="combo-count">0</div><div id="combo-label">HITS</div></div>
    <div id="enemy-count"></div>
    <div id="boss-bar-wrap">
      <div id="boss-name">SER BOLDWYN THE HOLLOW</div>
      <div id="boss-hp-bg"><div id="boss-hp"></div></div>
    </div>
    <div id="wave-banner"></div>
  </div>

  <div class="end-screen" id="victory-screen">
    <div class="end-title">VICTORY</div>
    <div class="end-sub">The hollow knight has fallen. The crossing is safe.</div>
    <button class="restart-btn" data-restart>PLAY AGAIN</button>
  </div>
  <div class="end-screen" id="gameover-screen">
    <div class="end-title">GAME OVER</div>
    <div class="end-sub">The village needs a sturdier hero.</div>
    <button class="restart-btn" data-restart>TRY AGAIN</button>
  </div>

  <div id="pause-screen"><div id="pause-inner"><h2>PAUSED</h2><p>Press ESC to resume &nbsp;·&nbsp; R to restart</p></div></div>

  <div id="debug-panel">
    <h4>DEBUG (F3 toggles panel)</h4>
    <div id="debug-stats">…</div>
    <label><input type="checkbox" id="dbg-collider" /> Physics colliders</label>
    <label><input type="checkbox" id="dbg-hitbox" /> HitBoxes</label>
    <label><input type="checkbox" id="dbg-hurtbox" /> HurtBoxes</label>
    <label><input type="checkbox" id="dbg-aistate" /> AI state labels</label>
    <label><input type="checkbox" id="dbg-slots" /> Attack slots</label>
    <label><input type="checkbox" id="dbg-score" /> Enemy AI scores</label>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
