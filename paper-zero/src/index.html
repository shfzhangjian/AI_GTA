<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>纸上归零</title><link rel="stylesheet" href="style.css"></head>
<body><main class="desk"><header><div><p class="eyebrow">NOTEBOOK ACTION / 01</p><h1>纸上归零 <span>Paper Zero</span></h1></div><div class="head-actions"><button id="music" title="音乐开关">♫ 音乐：关</button><button id="pause">Ⅱ 暂停</button></div></header>
