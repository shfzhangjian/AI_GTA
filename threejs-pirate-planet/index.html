<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玥玥星球 — 微缩航海星球</title>
  <style>
    :root {
      --ink: #eaf2ff;
      --panel: rgba(10, 18, 34, 0.72);
      --line: rgba(140, 190, 255, 0.25);
      --accent: #6fd3ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060e; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    #app { position: fixed; inset: 0; }
    /* canvas CSS 尺寸必须显式=视口，否则 DPR>1 时 setSize(...,false) 与 scissor/viewport
       用的 CSS 坐标不一致 → 右下角 mini 视口被画到可见区外/错位。 */
    /* canvas 钉在视口 (0,0)：scissor/mini 视口以 canvas 左上角 = 视口左上角为前提；
       canvas 被布局推离 (0,0) 会导致右下角 mini 整体平移甚至裁到屏外。 */
    #gl { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ── HUD（§37 UI 不遮挡主画面；右下角留给 Mini Globe，§24） ── */
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    .title { font-size: 15px; font-weight: 700; letter-spacing: .06em; opacity: .92; }
    .title small { display: block; font-size: 10px; font-weight: 400; opacity: .55; letter-spacing: .12em; margin-top: 3px; }

    .bar {
      display: flex; gap: 6px; align-items: center;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 6px; backdrop-filter: blur(8px);
    }
    button {
      font: inherit; font-size: 12px; color: var(--ink);
      background: rgba(255,255,255,.05); border: 1px solid transparent;
      border-radius: 7px; padding: 6px 11px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover { background: rgba(111,211,255,.16); }
    button.on { background: rgba(111,211,255,.26); border-color: var(--accent); }
    .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 3px; }

    .row { display: flex; align-items: center; gap: 8px; font-size: 11px; opacity: .85; padding: 0 4px; }
    .row label { opacity: .6; min-width: 42px; }
    input[type=range] { width: 110px; accent-color: var(--accent); }

    /* 状态 / 统计 */
    #stats {
      position: fixed; bottom: 14px; left: 16px; z-index: 10;
      font: 11px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      color: rgba(234,242,255,.72);
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 9px; padding: 7px 10px; backdrop-filter: blur(8px);
      white-space: pre;
    }

    #merchant-panel {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      width: min(270px, calc(100vw - 32px));
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px; backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    #merchant-panel h2 {
      margin: 0 0 8px; font-size: 12px; letter-spacing: .08em;
      font-weight: 700; color: rgba(234,242,255,.9);
    }
    .merchant-list { display: flex; flex-direction: column; gap: 7px; }
    .merchant-row {
      display: grid; grid-template-columns: 1fr auto; gap: 7px; align-items: center;
      padding: 7px; border: 1px solid rgba(140,190,255,.16);
      border-radius: 8px; background: rgba(0,0,0,.18);
    }
    .merchant-name { font-size: 12px; font-weight: 700; }
    .merchant-meta { margin-top: 2px; font: 10px/1.45 ui-monospace, "SF Mono", Menlo, monospace; color: rgba(234,242,255,.65); }
    .merchant-status { margin-top: 3px; font-size: 11px; color: #b9e8ff; }
    .merchant-status.danger { color: #ffd0b0; }
    .merchant-row button {
      width: 34px; height: 34px; padding: 0; border-radius: 8px;
    }

    /* Mini Globe 外框（Canvas 由 renderer scissor 绘制，此处仅装饰边框） */
    #mini-frame {
      position: fixed; z-index: 9; pointer-events: none;
      border: 1px solid var(--line); border-radius: 14px;
      /* 必须透明：小地球是 WebGL 画在 canvas 上的，不透明背景会盖住它 */
      background: transparent;
      box-shadow: 0 6px 26px rgba(0,0,0,.35);
      /* 关键：content-box → 1px 边框落在视口「外侧」，不挤占 WebGL 球渲染区，边框才会正好框住小地球 */
      box-sizing: content-box;
      outline: 1px solid transparent;   /* 占位稳定 */
    }
    #mini-frame .tag {
      position: absolute; top: -18px; left: 2px; font-size: 10px;
      letter-spacing: .1em; opacity: .5;
    }

    /* 信息面板（§28/§29） */
    #info {
      position: fixed; z-index: 11; min-width: 190px; max-width: 250px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 11px; padding: 11px 13px; backdrop-filter: blur(10px);
      font-size: 12px; line-height: 1.65;
      opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
      pointer-events: none;
    }
    #info.show { opacity: 1; transform: none; }
    #info.pickable { pointer-events: auto; }
    #info h3 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
    #info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
    #info dt { opacity: .55; }
    #info dd { margin: 0; text-align: right; }
	    #info .actions { margin-top: 9px; display: flex; gap: 6px; }

	    #camera-ui {
	      position: fixed; right: 22px; bottom: 218px; z-index: 12;
	      display: none; flex-direction: column; align-items: flex-end; gap: 8px;
	    }
	    #camera-ui.local { display: flex; }
	    #camera-toggle {
	      width: 42px; height: 42px; padding: 0; display: grid; place-items: center;
	      border-radius: 10px; background: var(--panel); border-color: var(--line);
	      backdrop-filter: blur(8px); font-size: 18px;
	    }
	    #camera-toggle.on { border-color: var(--accent); background: rgba(111,211,255,.22); }
	    #camera-pad {
	      display: none; grid-template-columns: repeat(3, 36px); grid-auto-rows: 36px; gap: 6px;
	      padding: 8px; background: var(--panel); border: 1px solid var(--line);
	      border-radius: 10px; backdrop-filter: blur(8px);
	    }
	    #camera-ui.open #camera-pad { display: grid; }
	    #camera-pad button {
	      width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
	      border-radius: 8px; font-size: 15px; line-height: 1;
	    }
	    #camera-pad .empty { width: 36px; height: 36px; }

	    /* 加载遮罩 */
    #loading {
      position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; gap: 14px;
      background: radial-gradient(1200px 800px at 50% 40%, #10203c, #05060e 70%);
      text-align: center; transition: opacity .5s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .globe { font-size: 46px; animation: spin 3.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .txt { font-size: 12px; letter-spacing: .18em; opacity: .7; }
    #bar { width: 210px; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; margin: 0 auto; }
    #bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    #hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
      font-size: 11px; opacity: .45; letter-spacing: .04em; text-align: center;
    }
    .credit { position: fixed; bottom: 2px; left: 16px; z-index: 5; font-size: 9px; opacity: .28; }
    #fatal {
      position: fixed; inset: 0; z-index: 99; display: none; place-content: center;
      background: rgba(20,6,8,.94); color: #ffd9d9; font: 12px/1.7 ui-monospace, monospace;
      padding: 40px; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app"><canvas id="gl"></canvas></div>

  <div id="hud">
    <div class="title">玥玥星球<small>微缩航海星球 · THREE.JS DEMO</small></div>
    <div class="bar">
      <button id="btn-globe" class="on">🌍 全球</button>
      <button id="btn-local">🔍 局部</button>
      <span class="sep"></span>
      <button id="btn-routes">🧭 航线</button>
      <button id="btn-clouds" class="on">☁️ 云层</button>
    </div>
    <div class="bar">
      <div class="row"><label>太阳</label><input id="sun" type="range" min="0" max="100" value="42" /><span id="tod">白天</span></div>
    </div>
  </div>

	  <div id="stats">booting…</div>
	  <section id="merchant-panel" aria-label="商船列表">
	    <h2>商船列表</h2>
	    <div id="merchant-list" class="merchant-list"></div>
	  </section>
	  <div id="mini-frame"><span class="tag">MINI GLOBE</span></div>
	  <div id="info"></div>
	  <div id="camera-ui">
	    <button id="camera-toggle" title="镜头" aria-label="镜头">📷</button>
	    <div id="camera-pad" aria-label="局部镜头控制">
	      <span class="empty"></span>
	      <button data-camera-move="forward" title="前移" aria-label="前移">▲</button>
	      <button data-camera-zoom="in" title="拉近" aria-label="拉近">＋</button>
	      <button data-camera-move="left" title="左移" aria-label="左移">◀</button>
	      <span class="empty"></span>
	      <button data-camera-move="right" title="右移" aria-label="右移">▶</button>
	      <span class="empty"></span>
	      <button data-camera-move="back" title="后移" aria-label="后移">▼</button>
	      <button data-camera-zoom="out" title="拉远" aria-label="拉远">－</button>
	    </div>
	  </div>
	  <div id="hint">拖动旋转 · 滚轮缩放 · 点击船只查看信息 · 点击右下小地球飞行</div>
  <div class="credit">3D assets: Kenney (kenney.nl) — Pirate Kit, CC0</div>

  <div id="loading">
    <div class="globe">🌍</div>
    <div class="txt" id="loadtxt">正在装载星球资产…</div>
    <div id="bar"><i></i></div>
  </div>

  <div id="fatal"></div>

  <script>
    // 顶部兜底：任何未捕获错误都显示出来，避免「黑屏无提示」
    window.addEventListener('error', (e) => showFatal(e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '')));
    window.addEventListener('unhandledrejection', (e) => showFatal('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
    function showFatal(msg) {
      const el = document.getElementById('fatal');
      if (!el) return;
      el.style.display = 'grid';
      el.textContent = '出错了：\n' + msg;
    }
    window.__showFatal = showFatal;
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
