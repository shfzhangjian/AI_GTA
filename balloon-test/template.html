<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee9df">
<title>气球测试 — The Balloon Test</title>
<meta name="description" content="一点空气，一点好奇。一个可以触摸、泵气、爆破和慢动作重播的乳胶实验。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee9df;--ink:#35372e;--muted:#828279;--accent:#bd5c40;--line:rgba(53,55,46,.19);font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}button,a{touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}#world{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}#world:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}.grain{position:fixed;inset:0;pointer-events:none;opacity:.11;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.4' filter='url(%23n)'/%3E%3C/svg%3E")}
.ui{position:fixed;inset:0;pointer-events:none}.ui button,.ui a{pointer-events:auto}header{position:absolute;left:4.2vw;right:4.2vw;top:max(32px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow,.mono{font-family:'DM Mono',monospace;font-weight:400}.eyebrow{font-size:10px;letter-spacing:.18em;line-height:1.7}.brand{max-width:340px}.brand .mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:10px}h1{font-family:'Noto Serif SC',serif;font-size:clamp(26px,3vw,43px);line-height:1.5;font-weight:500;letter-spacing:-.055em;margin:12px 0 7px}.question{font-family:'Noto Serif SC',serif;font-size:12px;color:#6f7066;letter-spacing:.05em;margin:0}.controls{display:flex;gap:25px;align-items:center;padding-top:0}.control{background:none;border:0;border-bottom:1px solid transparent;padding:9px 0 8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;display:flex;gap:7px;align-items:center;transition:border-color .2s,color .2s}.control:hover{border-color:var(--ink)}.control[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.key{font-family:'DM Mono',monospace;font-size:9px;color:#96958c}.sound-icon{width:12px;height:12px;display:inline-flex;align-items:center;gap:2px}.sound-icon i{width:1px;background:currentColor;height:5px}.sound-icon i:nth-child(2){height:10px}.sound-icon i:nth-child(3){height:7px}.muted .sound-icon i{height:2px!important}
.readout{position:absolute;left:4.2vw;top:200px;display:flex;align-items:baseline;gap:17px}.pump-label{font-family:'Noto Serif SC',serif;font-size:12px;color:#77796e}.pump-number{font-family:'DM Mono',monospace;font-size:31px;letter-spacing:-.08em;margin-left:8px;color:var(--ink)}.readout .divider{width:1px;height:24px;background:var(--line);align-self:center}.pressure-number{font-family:'DM Mono',monospace;font-size:31px;letter-spacing:-.08em;color:var(--accent)}.unit{font-family:'DM Mono',monospace;font-size:10px;color:#85857a;margin-left:7px}.readout-note{position:absolute;left:4.2vw;top:247px;font-size:9px;letter-spacing:.14em;color:#939287}
.specimen{position:absolute;right:4.2vw;bottom:185px;text-align:right}.specimen .rule{width:46px;height:1px;background:var(--accent);margin:0 0 13px auto}.specimen .name{font-family:'Noto Serif SC',serif;font-size:13px;margin:5px 0}.specimen .small{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.08em}.caption{position:absolute;bottom:104px;left:18px;right:18px;text-align:center;font-family:'Noto Serif SC',serif;font-size:clamp(16px,1.7vw,21px);font-style:italic;font-weight:400;letter-spacing:.055em;transition:opacity .2s}.footer{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:4.2vw;right:4.2vw;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.instruction{font-size:11px;letter-spacing:.07em;color:#77796e}.instruction strong{font-weight:500;color:var(--ink)}.spacebar{font-family:'DM Mono',monospace;display:inline-block;font-size:9px;border:1px solid #bab9ad;padding:3px 11px;border-radius:3px;margin:0 5px}.edition{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:#99968a}.credit{color:#787a70;text-decoration:none;font-family:'DM Mono',monospace;font-size:10px}.credit:hover{color:var(--accent)}.status{position:absolute;top:112px;right:4.2vw;background:var(--ink);color:#f4f0e7;font-size:10px;letter-spacing:.13em;padding:12px 18px;display:none}.status.show{display:block}.status .dot{color:#d3ad80;margin-right:7px}
.result{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:min(380px,86vw);padding:33px 36px 30px;background:rgba(247,244,237,.94);border:1px solid rgba(87,84,65,.15);box-shadow:0 14px 60px rgba(70,59,39,.08);backdrop-filter:blur(16px);pointer-events:auto;opacity:0;visibility:hidden;transition:opacity .5s,transform .5s}.result.show{opacity:1;visibility:visible;transform:translate(-50%,-46%)}.result h2{font-family:'Noto Serif SC',serif;font-weight:500;font-size:48px;letter-spacing:-.06em;margin:13px 0 19px}.result .verdict{font-family:'Noto Serif SC',serif;font-size:13px;color:#747769;margin:18px 0 21px}.stats{font-family:'DM Mono',monospace;font-size:13px;line-height:1.8;padding-bottom:17px;border-bottom:1px solid var(--line)}.stats small{display:block;font-family:'DM Sans',sans-serif;color:#99988c;font-size:9px;letter-spacing:.08em}.best{font-size:10px;color:#888a7c;margin:15px 0 23px}.result-actions{display:flex;align-items:center;gap:23px}.again{background:var(--ink);border:1px solid var(--ink);color:#f7f4ea;padding:12px 23px;font-size:11px;letter-spacing:.08em}.again:hover{background:var(--accent);border-color:var(--accent)}.replay{background:none;border:0;border-bottom:1px solid var(--line);font-size:10px;padding:9px 0}.replay:hover{border-color:var(--ink)}.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);z-index:20;font-size:10px;letter-spacing:.16em;transition:opacity .5s;pointer-events:none}.loading span:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:12px;animation:breathe 1.2s infinite}.loading.done{opacity:0}.error{position:fixed;inset:30% 10%;font-family:'Noto Serif SC',serif;display:none;text-align:center;line-height:2;background:var(--paper);padding:24px}.error.show{display:block}@keyframes breathe{50%{opacity:.3}}
@media(max-width:700px){header{top:max(22px,env(safe-area-inset-top));left:25px;right:25px;gap:10px}.eyebrow{font-size:8px;letter-spacing:.12em}h1{font-size:29px;margin-top:9px}.question{font-size:10px}.controls{display:grid;grid-template-columns:auto auto;gap:4px 17px;padding-top:0}.control{font-size:9px;padding:8px 0;gap:5px}.key{display:none}.readout{left:25px;top:160px;gap:12px}.pump-number,.pressure-number{font-size:26px}.readout-note{left:25px;top:200px;font-size:8px}.specimen{right:25px;bottom:177px}.specimen .small{font-size:8px}.specimen .name{font-size:11px}.caption{bottom:111px;font-size:16px}.footer{left:25px;right:25px;bottom:max(25px,env(safe-area-inset-bottom));padding-top:15px;align-items:flex-start}.instruction{font-size:10px;max-width:210px;line-height:1.9}.spacebar{display:none}.edition{display:none}.credit{font-size:9px;padding-top:4px}.status{top:132px;right:25px;font-size:8px;padding:10px 12px}.result{top:45%;padding:27px 29px}.result h2{font-size:43px}}
@media(max-height:500px) and (min-width:601px){header{top:18px}h1{font-size:24px;margin:5px 0}.question{font-size:10px}.readout{top:134px}.readout-note{top:176px}.specimen{bottom:104px}.caption{bottom:67px;font-size:14px}.footer{bottom:17px;padding-top:10px}.result{top:49%;padding:18px 25px;width:340px}.result h2{font-size:35px;margin:5px 0}.result .verdict{margin:10px 0}.best{margin:10px 0}.stats{padding-bottom:9px}}
@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important;animation:none!important}}
@media(max-width:700px){.specimen{display:none}.control{min-height:44px;min-width:44px}.controls{gap:0 12px}}
#world:focus-visible{outline:none}body:has(#world:focus-visible) .instruction strong{border-bottom:1px dotted var(--accent)}
.caption{font-synthesis:style}
</style>
</head>
<body>
<canvas id="world" tabindex="0" role="button" aria-label="轻触或按空格键，向气球泵气"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ui">
 <header>
  <div class="brand"><div class="eyebrow"><span class="mark"></span>THE BALLOON TEST</div><h1>气球测试。</h1><p class="question">它能承受多少空气？</p></div>
  <nav class="controls" aria-label="实验控制">
   <button id="water" class="control" aria-pressed="false" aria-label="切换水模式，快捷键 W">水 <span class="key">W</span></button>
   <button id="flick" class="control" aria-label="轻弹气球，快捷键 F">轻弹 <span class="key">F</span></button>
   <button id="reset" class="control" aria-label="重置实验，快捷键 R">重置 <span class="key">R</span></button>
   <button id="sound" class="control" aria-pressed="true" aria-label="切换声音"><span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>声音</button>
  </nav>
 </header>
 <div class="readout" aria-label="泵数和压力"><span class="pump-label">泵<span id="count" class="pump-number">0</span></span><span class="divider"></span><span><span id="pressure" class="pressure-number">0.0</span><span class="unit">kPa</span></span></div>
 <div class="readout-note">一点空气。一个未知的极限。</div>
 <div class="specimen"><div class="rule"></div><div id="specimen-id" class="small">SPECIMEN / 001</div><div id="specimen-name" class="name">天然乳胶 · 空气</div><div class="small">GENT ELASTICITY MODEL</div></div>
 <div id="caption" class="caption" aria-live="polite">第一口气最难。</div>
 <div class="footer"><div id="instruction" class="instruction"><strong>轻触任意位置</strong> 或 <span class="spacebar">SPACE</span> 泵气</div><div class="edition">A SMALL EXPERIMENT IN CURIOSITY</div><a class="credit" href="https://x.com/vib3coded" target="_blank" rel="noopener noreferrer">@vib3coded ↗</a></div>
 <div id="replay-status" class="status"><span class="dot">●</span>慢动作 ×12</div>
 <section id="result" class="result" aria-labelledby="result-title" aria-hidden="true">
  <div class="eyebrow">THE LIMIT HAS BEEN FOUND</div><h2 id="result-title">爆了。</h2>
  <div class="stats"><span id="result-stats"></span><small>泵数 · 面积拉伸 · 爆破压力</small></div>
  <p id="verdict" class="verdict"></p><p id="best" class="best"></p>
  <div class="result-actions"><button id="again" class="again">再来一次 ↗</button><button id="replay" class="replay">慢动作重播 <span class="key">S</span></button></div>
 </section>
</div>
<div id="loading" class="loading"><span>正在准备纸质工作室</span></div>
<div id="error" class="error" role="alert">这个实验需要 WebGL。<br>请在支持 3D 的浏览器中重新打开。</div>
<!-- APPLICATION_BUNDLE -->
</body></html>
