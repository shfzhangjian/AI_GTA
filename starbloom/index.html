<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c27"><meta name="description" content="在五颗球面小星球之间冒险的原创 3D 射击肉鸽。"><title>星环漫游 · STARBLOOM</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230b1230'/%3E%3Ccircle cx='20' cy='20' r='9' fill='%2375efd6'/%3E%3Cellipse cx='20' cy='20' rx='17' ry='5' fill='none' stroke='%23ffcf78' stroke-width='3' transform='rotate(-30 20 20)'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main id="app"><canvas id="game" aria-label="星环漫游 3D 游戏场景"></canvas><div class="vignette"></div><div id="damage"></div>
<header id="top"><a class="brand" href="#" id="home" aria-label="打开暂停菜单"><span class="brand-mark">✦</span><span>STARBLOOM<small>星环漫游</small></span></a><div class="top-controls"><button id="sound" class="icon-button" title="音效开关" aria-label="静音游戏音效" aria-pressed="true">♫</button><details class="audio-settings"><summary aria-label="音量设置" title="音量设置">音量</summary><div class="audio-popover"><strong>游戏声音</strong><p id="audio-status" role="status">点击开始后开启游戏声音</p><label for="sfx-volume">战斗音效 <output id="sfx-value">70%</output></label><input id="sfx-volume" type="range" min="0" max="100" step="1" value="70"><label for="ambient-volume">星球环境 <output id="ambient-value">25%</output></label><input id="ambient-volume" type="range" min="0" max="100" step="1" value="25"><small>M 键可随时静音</small></div></details><button id="pause" class="icon-button" title="暂停 Esc" aria-label="暂停">Ⅱ</button></div></header>
<section id="hud" class="hidden" aria-label="战斗状态"><div class="planet-tag"><span class="orbit-dot"></span><div><small id="planet-index">PLANET 01</small><strong id="planet-name">风芽草原</strong></div></div><div class="life"><div class="life-top"><span>♡ <b id="hp-text">100 / 100</b></span><span id="wave">第 1 / 3 波</span></div><div class="life-track"><i id="hp-fill"></i></div><div class="life-bottom"><span id="enemy-count">清理星球</span><span id="dash-label">冲刺就绪</span></div></div><div class="run-panel"><span>航程 <b id="visited">0 / 5</b></span><span>击破 <b id="kills">0</b></span></div></section>
<div id="notification" role="status"></div><div id="target-indicator" class="hidden">▲<span>敌人</span></div><div id="crosshair" class="hidden"><i></i><i></i><i></i><i></i></div><div id="biome-note" class="hidden"></div>
<div id="bottom" class="hidden"><div class="ability"><span>⇧</span><div><strong>彗星冲刺</strong><div class="cooldown"><i id="dash-fill"></i></div></div></div><div class="keyboard-help"><span><kbd>W A S D</kbd> 移动</span><span><kbd>鼠标 / 空格</kbd> 射击</span><span><kbd>Q E</kbd> 转动视角</span><span><kbd>Esc</kbd> 暂停</span></div><button id="auto" class="pill active">辅助瞄准 · 开</button></div>
<div id="overlay"><section id="title-screen" class="screen title-screen"><div class="chapter">小小星球 · 无尽旅途</div><h1>星环<span>漫游</span></h1><p class="english">STARBLOOM <span>ODYSSEY</span></p><p class="intro">沿着星球的弧线奔跑。<br>击碎敌群，把下一次冒险射向银河。</p><button class="primary" id="start"><span>开始航程</span><span>✦</span></button><button class="secondary" id="choose-start">选择起始星球</button><div class="intro-hint"><span>W A S D 移动</span><span>按住鼠标射击</span><span>Shift 冲刺</span></div><p class="original">原创球面冒险 · 5 个星球 · 每次升级由你决定</p></section></div>
<div id="touch" class="hidden"><div id="joystick"><span id="stick"></span></div><button id="touch-dash">冲刺</button><button id="touch-fire">射击</button></div><div id="loading"><div class="loading-star">✦</div><strong>正在点亮星球</strong><span>准备球面引力与星尘</span></div>
