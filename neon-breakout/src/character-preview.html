<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23d9ac68%27/%3E%3C/svg%3E"><title>霓城突围 · 角色模型展示</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#e8edf5;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}canvas{width:100vw;height:100vh;display:block}header{position:absolute;left:5%;top:5%;pointer-events:none}header small{font-size:10px;letter-spacing:3px;color:#dbb978}h1{font-size:26px;font-weight:500;margin:10px 0}header p{font-size:11px;color:#94a0b4;letter-spacing:1px}.captions{position:absolute;left:4%;right:4%;bottom:7%;display:flex;justify-content:space-around;text-align:center;pointer-events:none}.captions b{font-size:15px;display:block;margin-bottom:8px}.captions small{font-size:10px;color:#91a0b3}a{position:absolute;top:5%;right:5%;color:#e9c378;font-size:12px;text-decoration:none}#error{position:absolute;inset:0;padding:100px;background:#182536;color:#f99}</style></head><body><canvas id="canvas"></canvas><header><small>霓城突围 / 角色模型更新</small><h1>从轮廓，到每一道衣褶。</h1><p>成人比例 · 连帽运动装 · 分段关节 · 破衣巨魁</p></header><a href="../">返回游戏 →</a><div class="captions"><div><b>林墨 / 正面</b><small>卷发、五官、抬枪姿态</small></div><div><b>林墨 / 背面</b><small>连帽衫、裤脚条纹、白色球鞋</small></div><div><b>天街怪物</b><small>撕裂衣料与绿色皮肤</small></div><div><b>巨臂阿魁</b><small>宽肩、肌肉、腹部与破损紫衣</small></div></div><script type="module">
import * as T from '../vendor/three.module.min.js';import {makeHero,makeZombie,animateHero,animateMonster} from './characters.mjs';
try{const canvas=document.getElementById('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1.5);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0x111a28);scene.fog=new T.Fog(0x111a28,15,40);const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,2.85,11.8);camera.lookAt(0,1.52,0);
scene.add(new T.HemisphereLight(0xcce3ff,0x1b2331,2));const light=new T.DirectionalLight(0xffdcc0,4.5);light.position.set(-4,8,6);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-7,right:7,top:7,bottom:-7});light.shadow.bias=-.0007;scene.add(light);const rim=new T.DirectionalLight(0x75adff,3.2);rim.position.set(6,4,-5);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x1d293c,roughness:.82,metalness:.08}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;floor.receiveShadow=true;scene.add(floor);
const heroes=[makeHero(),makeHero()],zombie=makeZombie(),boss=makeZombie(true);heroes[0].position.x=-3.8;heroes[0].rotation.y=Math.PI-.24;heroes[1].position.x=-1.3;heroes[1].rotation.y=-.27;zombie.position.x=1.25;zombie.rotation.y=-.2;boss.position.x=3.85;boss.scale.setScalar(1.0);boss.rotation.y=-.12;for(const o of [...heroes,zombie,boss])scene.add(o);
let clock=0,previous=0;function draw(t){clock+=(t-(previous||t))/1000;previous=t;heroes.forEach(h=>animateHero(h,clock,{menu:true,gunCount:2}));animateMonster(zombie,clock,0);animateMonster(boss,clock,0,{boss:true});renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);window.preview={scene,camera,renderer,heroes,zombie,boss};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}catch(e){document.body.insertAdjacentHTML('beforeend','<div id="error"></div>');document.getElementById('error').textContent=String(e);console.error(e);}
</script></body></html>
