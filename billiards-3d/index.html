<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 台球 · Three.js</title>
<style>
  :root{
    --panel: rgba(16,20,28,.82);
    --line: rgba(255,255,255,.12);
    --accent: #e8b64c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0d12;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:10}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 16px;color:#dfe6ef;backdrop-filter:blur(6px);pointer-events:auto}
  #scores{display:flex;gap:22px;align-items:center}
  .pname{font-size:12px;letter-spacing:.15em;color:#8b97a8;text-transform:uppercase}
  .pscore{font-size:26px;font-weight:700;color:#fff;line-height:1.1}
  .pscore.me{color:var(--accent)}
  #turntip{font-size:12px;color:#9aa7b8;margin-top:2px}
  #status{font-size:14px;max-width:42vw;text-align:right;line-height:1.5}
  #status .warn{color:#ff7a6e}

  /* ---------- ball tray (potted balls) ---------- */
  #tray{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;
    gap:6px;z-index:10;pointer-events:none;align-items:center}
  #tray .lbl{color:#7d8896;font-size:11px;letter-spacing:.2em;margin-right:6px}
  .tb{width:22px;height:22px;border-radius:50%;box-shadow:inset -3px -4px 6px rgba(0,0,0,.45),
    inset 2px 3px 4px rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.5)}

  /* ---------- power bar ---------- */
  #powerwrap{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);width:min(420px,60vw);
    height:14px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);
    overflow:hidden;z-index:10;opacity:0;transition:opacity .25s}
  #powerwrap.on{opacity:1}
  #powerfill{height:100%;width:0%;border-radius:8px;
    background:linear-gradient(90deg,#3ecf6e,#e8d44c 55%,#e8604c)}
  #powerlabel{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);color:#aeb9c8;
    font-size:11px;letter-spacing:.3em;z-index:10;opacity:0;transition:opacity .25s}
  #powerwrap.on + #powerlabel, #powerlabel.on{opacity:1}

  /* ---------- bottom help ---------- */
  #help{position:fixed;right:16px;bottom:14px;color:#6f7b8b;font-size:12px;line-height:1.7;
    text-align:right;z-index:10;pointer-events:none}
  #help b{color:#a9b4c2;font-weight:600}

  /* ---------- buttons ---------- */
  #btns{position:fixed;top:14px;right:190px;display:flex;gap:8px;z-index:11}
  .btn{background:var(--panel);border:1px solid var(--line);color:#c8d2de;border-radius:10px;
    padding:8px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--accent);color:#fff}

  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(6,9,14,.55);z-index:20;backdrop-filter:blur(4px)}
  #overlay.hide{display:none}
  #overlay .card{background:#121822;border:1px solid var(--line);border-radius:18px;
    padding:38px 46px;text-align:center;color:#e6ecf4;max-width:min(520px,86vw);
    box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #overlay h1{font-size:30px;font-weight:800;letter-spacing:.06em;margin-bottom:6px}
  #overlay h1 span{color:var(--accent)}
  #overlay p{color:#93a0b1;font-size:14px;line-height:1.8;margin:14px 0 22px}
  #startbtn{background:var(--accent);border:none;color:#1a1408;font-size:16px;font-weight:700;
    padding:13px 42px;border-radius:999px;cursor:pointer;letter-spacing:.1em}
  #startbtn:hover{filter:brightness(1.1)}
  #overmsg{font-size:17px;color:#dfe7f0}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="panel">
    <div id="scores">
      <div><div class="pname">你</div><div class="pscore me" id="scoreYou">0</div></div>
      <div><div class="pname">对手</div><div class="pscore" id="scoreAi">0</div></div>
    </div>
    <div id="turntip">击球权：<b id="turnWho">你</b></div>
  </div>
  <div class="panel" id="status">加载中…</div>
</div>

<div id="btns">
  <button class="btn" id="muteBtn">🔊 声音</button>
  <button class="btn" id="resetBtn">重新开始</button>
</div>

<div id="tray"><span class="lbl">已入袋</span></div>
<div id="powerwrap"><div id="powerfill"></div></div>
<div id="powerlabel">按住蓄力 · 松开击球</div>

<div id="help">
  <div><b>移动鼠标</b> 瞄准 · <b>按住左键</b> 蓄力 · <b>松开</b> 击球</div>
  <div><b>R</b> 重置母球（摔袋时） · <b>数字键 0</b> 恢复球堆</div>
</div>

<div id="overlay">
  <div class="card">
    <h1>3D <span>台球</span></h1>
    <p id="overmsg">
      标准 15 球摆位 + 母球。<br>
      鼠标瞄准，按住左键蓄力，松开击球。<br>
      击落一颗目标球 +1 分，母球摔袋 −1 分。<br>
      先把 15 颗球全部击落者获胜！
    </p>
    <button id="startbtn">开 局</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./libs/three.module.js" } }
</script>
<script>
// GitHub Pages 子目录兼容：把 importmap 相对路径改写到本目录（本地 http 服务时前缀为空串，行为不变）
(function(){
  var m = document.querySelector('script[type=importmap]');
  var o = JSON.parse(m.textContent);
  o.imports.three = location.pathname.replace(/[^/]*$/, '') + 'libs/three.module.js';
  m.textContent = JSON.stringify(o);
})();
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
