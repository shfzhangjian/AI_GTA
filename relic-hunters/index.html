<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182421"><title>遗物猎场 · RELIC FIELD</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="遗物猎场首页"><svg viewBox="0 0 40 44" aria-hidden="true"><path d="M20 2 36 12v19L20 42 4 31V12Z"/><path d="m20 9 9 9-9 15-9-15Z"/><path d="M20 9v24M11 18h18"/></svg><span>遗物猎场<small>RELIC / FIELD</small></span></a><nav><button class="nav-btn active" data-nav="field">远征营地</button><button class="nav-btn" data-nav="codex">收藏档案 <span id="collection-count">00</span></button><button class="nav-btn" data-nav="guide">生存手册</button></nav><div class="top-status"><span class="status-dot"></span>本地存档 <button id="sound-btn" class="icon-btn" aria-label="开启音效" title="开启音效">♫</button><button id="pause-btn" class="icon-btn" aria-label="暂停游戏" title="暂停 · Esc">Ⅱ</button></div></header>
<main class="expedition">
<aside class="field-notes"><div class="eyebrow">EXPEDITION RECORD / 001</div><h1 id="place-name">沉没庭院</h1><p class="place-copy" id="place-copy">文明沉入尘土。<br>故事仍在生长。</p><div class="coordinate">北纬 31° · 遗迹深处</div><div class="fine-rule"></div><div class="note-label">本次探索</div><div class="route" id="route"></div><div class="field-line"><span>区域进度</span><b id="floor-number">01 / 09</b></div><div class="field-line"><span>遗迹威胁</span><b id="threat">尚未唤醒</b></div><div class="fine-rule"></div><div class="note-label">收藏，是另一种拯救</div><p class="field-caption">拾起武器、遗物与旧时代的碎片。<br>组合力量，带回你的发现。</p><div class="bank"><span class="gem">◇</span><div><b id="bank-value">0</b><small>已归档的遗迹碎片</small></div></div><div class="build-tags" id="build-tags"></div></aside>
<section class="stage" aria-label="等距遗迹游戏区域"><canvas id="world" aria-label="游戏画面，WASD移动，鼠标攻击，空格闪避，E技能" tabindex="0"></canvas><div class="stage-top"><span class="world-label">THE SUNKEN GARDEN</span><span class="stage-state" id="stage-state">营地 · 准备远征</span></div><div id="boss-bar" class="boss-bar hidden"><div><span id="boss-name"></span><b id="boss-hp"></b></div><i><em id="boss-fill"></em></i></div><div id="room-prompt" class="room-prompt hidden"></div><div class="stage-bottom"><span class="camera-mark">↗ ISOMETRIC / 8-DIR</span><span id="enemy-status">一片尚未被打扰的废墟</span></div><div class="vignette"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="level-progress" class="xp-progress"><div></div></div></section>
<aside class="journal" id="journal"></aside>
</main>
<footer class="hud"><div class="health-block"><span class="hud-label">生命 / VITALITY</span><div class="health-track"><span id="health-fill"></span><em id="shield-fill"></em></div><b id="health-value">110 / 110</b></div><div class="hud-money"><span>◈</span><b id="gold-value">0</b><small>金币</small><span class="xp-token">LV.</span><b id="level-value">1</b></div><div class="action-strip"><button id="attack-action" class="action-key"><kbd>鼠标</kbd><span>攻击</span></button><button id="dodge-action" class="action-key"><kbd>SPACE</kbd><span>闪避</span><i></i></button><button id="skill-action" class="action-key"><kbd>E</kbd><span id="skill-label">藤蔓陷阱</span><i></i></button><button id="supply-action" class="action-key"><kbd>Q</kbd><span id="supply-label">温苔茶 × 2</span></button></div><div class="movement-tip"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>移动</span></div></footer>

<script type="module" src="ui.js"></script>
