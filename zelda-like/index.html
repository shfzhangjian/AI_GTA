<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>塞尔达风格开放世界 - Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    #app { width: 100%; height: 100%; }
    canvas { display: block; }

    /* HUD */
    #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px 20px; pointer-events: none; color: #fff; z-index: 10; }
    .hud-row { display: flex; gap: 18px; align-items: center; }
    .bar-wrap { width: 240px; height: 18px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.4); border-radius: 10px; overflow: hidden; }
    .bar-fill { height: 100%; width: 100%; transition: width .15s linear; }
    .hp-fill { background: linear-gradient(90deg, #ff5a5a, #ff8a6a); }
    .st-fill { background: linear-gradient(90deg, #ffd75a, #ffe9a3); }
    .hud-label { font-size: 13px; letter-spacing: 1px; opacity: .85; }

    #weapon-panel { position: fixed; bottom: 16px; left: 16px; color: #fff; background: rgba(0,0,0,.5); padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); z-index: 10; }
    #weapon-panel h3 { font-size: 14px; margin-bottom: 6px; opacity: .8; }
    .weapon-slot { display: inline-block; min-width: 110px; margin: 2px 8px 2px 0; padding: 6px 10px; background: rgba(255,255,255,.08); border-radius: 8px; border: 1px solid transparent; cursor: default; font-size: 13px; }
    .weapon-slot.active { border-color: #ffd75a; background: rgba(255,215,90,.18); }
    .weapon-slot .dmg { opacity: .7; font-size: 11px; }

    #msg { position: fixed; bottom: 22%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .4s; z-index: 12; pointer-events: none; }
    #hint { position: fixed; bottom: 16px; right: 16px; color: #fff; font-size: 12px; opacity: .75; text-align: right; line-height: 1.7; z-index: 10; background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 8px; }

    #minimap { position: fixed; top: 14px; right: 14px; width: 180px; height: 180px; background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.35); border-radius: 10px; z-index: 10; }

    /* 调试窗口 (F3 切换) */
    #debug { position: fixed; top: 210px; right: 14px; width: 240px; color: #9f9; background: rgba(10,20,10,.82); border: 1px solid rgba(120,255,120,.4); border-radius: 8px; padding: 10px 12px; font: 12px/1.65 ui-monospace, Menlo, monospace; z-index: 11; white-space: pre; pointer-events: none; }

    /* 开始/死亡界面 */
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 50; }
    #overlay h1 { font-size: 48px; margin-bottom: 14px; color: #ffd75a; }
    #overlay p { margin: 4px; opacity: .85; }
    #overlay button { margin-top: 22px; padding: 12px 44px; font-size: 18px; background: #ffd75a; color: #222; border: none; border-radius: 8px; cursor: pointer; }
    #overlay button:hover { background: #ffe9a3; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="hud-row">
      <span class="hud-label">HP</span>
      <div class="bar-wrap"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
      <span class="hud-label">耐力</span>
      <div class="bar-wrap"><div id="st-bar" class="bar-fill st-fill"></div></div>
    </div>
  </div>

  <div id="weapon-panel">
    <h3>武器 (1-6 切换, 左键近战, 右键射击)</h3>
    <div id="weapon-slots"></div>
  </div>

  <div id="msg"></div>

  <div id="hint">
    WASD 移动 | Shift 奔跑 | 移动鼠标即瞄准(面朝/扇面) | 左键近战(长按连挥) | 右键射击<br>
    C 拾取/交互 | 1-6 切换武器 | 空格 跳跃 | L 调试
  </div>

  <canvas id="minimap"></canvas>

  <div id="debug" class="hidden"></div>

  <div id="overlay">
    <h1 id="overlay-title">塞尔达风格开放世界</h1>
    <p id="overlay-text">初始武器：树枝。探索世界，捡拾武器，收集树枝点燃火堆制成火炬，杀羊吃果回血！</p>
    <button id="overlay-btn">开始游戏</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
